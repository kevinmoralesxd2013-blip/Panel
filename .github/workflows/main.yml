/* ---------------- 1. PANEL (JSON) ---------------- */
const PANEL_JSON = `{
  "modo": "log",
  "lobby": {
    "diamantes":  { "on": true,  "valor": 999999 },
    "oro":        { "on": false, "valor": 99999999 },
